
name: Deploy College Assistant to AWS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # FRONTEND BUILD
  # ==========================================
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # BACKEND CHECK
  # ==========================================
  backend:
    name: Check Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app

  # ==========================================
  # DEPLOY FRONTEND TO AWS S3
  # ==========================================
  
  deploy-frontend:
    name: Deploy Frontend to EC2
    needs: [frontend, backend]
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: frontend/dist/

      - name: Deploy frontend over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          test -n "$EC2_HOST"
          test -n "$EC2_USERNAME"
          test -n "$EC2_SSH_KEY"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/college-assistant.pem
          chmod 600 ~/.ssh/college-assistant.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/college-assistant.pem \
            "$EC2_USERNAME@$EC2_HOST" \
            'mkdir -p /tmp/college-assistant-dist'

          scp -i ~/.ssh/college-assistant.pem -r frontend/dist/. \
            "$EC2_USERNAME@$EC2_HOST:/tmp/college-assistant-dist/"

          ssh -i ~/.ssh/college-assistant.pem \
            "$EC2_USERNAME@$EC2_HOST" \
            'sudo mkdir -p /var/www/college-assistant &&
             sudo rsync -a --delete /tmp/college-assistant-dist/ /var/www/college-assistant/ &&
             sudo nginx -t &&
             sudo systemctl reload nginx &&
             rm -rf /tmp/college-assistant-dist'

  # ==========================================
  # DEPLOY BACKEND TO AWS EC2
  # ==========================================
  deploy-backend:
    name: Deploy Backend to AWS EC2
    needs: backend
    runs-on: ubuntu-latest

    steps:
      - name: Validate EC2 configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || {
            echo "::error::EC2_HOST secret is missing"
            exit 1
          }

          test -n "$EC2_USERNAME" || {
            echo "::error::EC2_USERNAME secret is missing"
            exit 1
          }

          test -n "$EC2_SSH_KEY" || {
            echo "::error::EC2_SSH_KEY secret is missing"
            exit 1
          }

          echo "EC2 configuration is present."

      - name: Deploy backend through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu

            echo "Connected to EC2"
            hostname

            APP_DIR="/home/ubuntu/college_assistant"

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: Application directory does not exist: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            echo "Application directory:"
            pwd

            echo "Checking application files..."
            ls -la

            if [ ! -d "$APP_DIR/backend" ]; then
              echo "ERROR: Backend source directory is missing."
              echo "Restore the backend from GitHub before deploying."
              exit 1
            fi

            if [ ! -f "$APP_DIR/backend/requirements.txt" ]; then
              echo "ERROR: backend/requirements.txt is missing."
              exit 1
            fi

            if [ ! -f "$APP_DIR/backend/app/main.py" ]; then
              echo "ERROR: backend/app/main.py is missing."
              exit 1
            fi

            echo "Backend source files are present."

            if [ ! -x "$APP_DIR/backend/venv/bin/python" ]; then
              echo "ERROR: Backend virtual environment is missing."
              echo "Create and configure the backend venv before deployment."
              exit 1
            fi

            if ! sudo systemctl cat college-assistant >/dev/null 2>&1; then
              echo "ERROR: college-assistant systemd service is not configured."
              echo "Configure the service before enabling automatic restarts."
              exit 1
            fi

            echo "Installing backend dependencies..."
            "$APP_DIR/backend/venv/bin/python" -m pip install \
              -r "$APP_DIR/backend/requirements.txt"

            echo "Restarting backend service..."
            sudo systemctl restart college-assistant

            echo "Checking backend service..."
            sudo systemctl is-active college-assistant

            echo "Backend deployment checks completed."

